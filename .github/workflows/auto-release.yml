name: Auto Release on Main Changes

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore MaterialManager_V01.csproj

      - name: Build
        run: dotnet build MaterialManager_V01.csproj -c Release --no-restore

      - name: Publish win-x64
        shell: pwsh
        run: |
          [xml]$proj = Get-Content "MaterialManager_V01.csproj"
          $versionNode = $proj.SelectSingleNode("//*[local-name()='Version']")
          $baseVersion = if ($versionNode) { $versionNode.InnerText.Trim() } else { "1.0.0" }
          $fullVersion = "$baseVersion.$env:GITHUB_RUN_NUMBER"
          dotnet publish MaterialManager_V01.csproj -c Release -r win-x64 --self-contained true -o publish /p:Version=$fullVersion /p:FileVersion=$fullVersion /p:AssemblyVersion=$fullVersion

      - name: Prepare release metadata
        id: meta
        shell: pwsh
        run: |
          [xml]$proj = Get-Content "MaterialManager_V01.csproj"
          $versionNode = $proj.SelectSingleNode("//*[local-name()='Version']")
          $baseVersion = if ($versionNode) { $versionNode.InnerText.Trim() } else { "1.0.0" }
          $tag = "v$baseVersion.$env:GITHUB_RUN_NUMBER"
          $zip = "MaterialManager_V01_$tag.zip"
          $payloadZip = Join-Path $env:RUNNER_TEMP "update_payload.zip"
          $updateInstallerDir = Join-Path $env:GITHUB_WORKSPACE "update-installer"
          $updateInstallerExe = Join-Path $updateInstallerDir "UpdateInstaller.exe"

          Compress-Archive -Path "publish\*" -DestinationPath $zip -Force
          Copy-Item $zip -Destination $payloadZip -Force

          "tag=$tag" >> $env:GITHUB_OUTPUT
          "zip=$zip" >> $env:GITHUB_OUTPUT
          "payload_zip=$payloadZip" >> $env:GITHUB_OUTPUT
          "update_installer_dir=$updateInstallerDir" >> $env:GITHUB_OUTPUT
          "update_installer_exe=$updateInstallerExe" >> $env:GITHUB_OUTPUT

      - name: Build update installer
        shell: pwsh
        run: |
          $payloadZip = "${{ steps.meta.outputs.payload_zip }}"
          $outputDir = "${{ steps.meta.outputs.update_installer_dir }}"
          New-Item -ItemType Directory -Force -Path $outputDir | Out-Null
          dotnet publish Installer_Source/UpdateInstaller.csproj -c Release -r win-x64 --self-contained true -o $outputDir /p:PayloadZip="$payloadZip"

      - name: Prepare release notes
        id: notes
        shell: pwsh
        run: |
          $tag = "${{ steps.meta.outputs.tag }}"
          $allTags = git tag --sort=-v:refname
          $previousTag = $allTags | Select-Object -First 1

          $notesFile = Join-Path $env:RUNNER_TEMP "release_notes.md"
          $lines = New-Object System.Collections.Generic.List[string]
          $lines.Add("## 📝 Was wurde geändert")
          $lines.Add("")

          if (-not [string]::IsNullOrWhiteSpace($previousTag)) {
            $commitLines = git log "$previousTag..HEAD" --pretty=format:"- %s" --no-merges
          } else {
            $commitLines = git log -n 20 --pretty=format:"- %s" --no-merges
          }

          if ($null -eq $commitLines -or $commitLines.Count -eq 0) {
            $lines.Add("- Technische Aktualisierung ohne detaillierte Einzelpunkte.")
          } else {
            foreach ($c in $commitLines) {
              if (-not [string]::IsNullOrWhiteSpace($c)) {
                $lines.Add($c)
              }
            }
          }

          $lines.Add("")
          if (-not [string]::IsNullOrWhiteSpace($previousTag)) {
            $lines.Add("**Full Changelog:** https://github.com/${{ github.repository }}/compare/$previousTag...$tag")
          } else {
            $lines.Add("**Repository:** https://github.com/${{ github.repository }}")
          }

          Set-Content -Path $notesFile -Value $lines -Encoding UTF8
          "notes_file=$notesFile" >> $env:GITHUB_OUTPUT

      - name: Create GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${{ steps.meta.outputs.tag }}"
          $zip = "${{ steps.meta.outputs.zip }}"
          $installerExe = "${{ steps.meta.outputs.update_installer_exe }}"
          $notesFile = "${{ steps.notes.outputs.notes_file }}"
          gh release create $tag --title "Release $tag" --notes-file $notesFile $zip $installerExe